<div class="ska-main">
  <header class="ska-topbar">
    <div class="ska-topbar__left">
      <div class="ska-topbar__title">Promotions</div>
      <div class="ska-topbar__breadcrumb">Special offers and discounts</div>
    </div>
    <div class="ska-topbar__right">
      <button type="button" class="ska-btn ska-btn--primary" id="btnAddPromo">
        <i class="fa-solid fa-plus"></i> Add Promotion
      </button>
    </div>
  </header>

  <main class="ska-content">
    <div id="adminError" class="ska-alert ska-alert--danger" style="display:none;margin-bottom:20px;" role="alert"></div>
    <div id="adminToast" class="ska-alert ska-alert--success" style="display:none;margin-bottom:20px;" role="status"></div>

    <div class="ska-card">
      <div class="ska-card__header">
        <h2 class="ska-card__title">Active &amp; Draft <span>Offers</span></h2>
      </div>
      <div class="ska-card__body">
        <table class="ska-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Branch</th>
              <th>Discount</th>
              <th>Valid</th>
              <th>Active</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="promosTableBody">
            <tr><td colspan="6" class="ska-table-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="ska-modal-backdrop" id="promoModal">
  <div class="ska-modal" role="dialog" aria-labelledby="promoModalTitle">
    <div class="ska-modal__header">
      <h3 class="ska-modal__title" id="promoModalTitle">Add Promotion</h3>
      <button type="button" class="ska-modal__close" id="promoModalClose" aria-label="Close">&times;</button>
    </div>
    <form id="promoForm" class="ska-modal__body">
      <input type="hidden" id="promoId" name="id">
      <div class="ska-form-grid">
        <div class="ska-form-field ska-form-field--full">
          <label for="promoTitle">Title</label>
          <input type="text" id="promoTitle" name="title" class="ska-input" required>
        </div>
        <div class="ska-form-field">
          <label for="promoBranch">Branch</label>
          <select id="promoBranch" name="branch" class="ska-input">
            <option value="Both">Both</option>
            <option value="Naguru">Naguru</option>
            <option value="Munyonyo">Munyonyo</option>
          </select>
        </div>
        <div class="ska-form-field">
          <label for="promoType">Discount type</label>
          <select id="promoType" name="discount_type" class="ska-input">
            <option value="percent">Percent</option>
            <option value="fixed">Fixed USD</option>
            <option value="free_night">Free nights</option>
          </select>
        </div>
        <div class="ska-form-field">
          <label for="promoValue">Discount value</label>
          <input type="number" id="promoValue" name="discount_value" class="ska-input" min="0" step="1" value="10">
        </div>
        <div class="ska-form-field">
          <label for="promoMinNights">Min nights</label>
          <input type="number" id="promoMinNights" name="min_nights" class="ska-input" min="1" value="1">
        </div>
        <div class="ska-form-field">
          <label for="promoActive">Active</label>
          <select id="promoActive" name="active" class="ska-input">
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>
        <div class="ska-form-field ska-form-field--full">
          <label for="promoDesc">Description</label>
          <textarea id="promoDesc" name="description" class="ska-input" rows="3"></textarea>
        </div>
      </div>
      <div class="ska-modal__footer">
        <button type="button" class="ska-btn ska-btn--ghost" id="promoModalCancel">Cancel</button>
        <button type="submit" class="ska-btn ska-btn--primary">Save Promotion</button>
      </div>
    </form>
  </div>
</div>
