<div class="ska-main">
  <header class="ska-topbar">
    <div class="ska-topbar__left">
      <div class="ska-topbar__title">Dashboard</div>
      <div class="ska-topbar__breadcrumb">Bookings and inquiries from your live site</div>
    </div>
  </header>

  <main class="ska-content">
    <div id="adminError" class="ska-alert ska-alert--danger" style="display:none;margin-bottom:20px;" role="alert"></div>

    <div class="ska-stats-grid" id="statsGrid">
      <div class="ska-stat-card ska-stat-card--gold">
        <div class="ska-stat-card__header">
          <div class="ska-stat-card__label">Rooms</div>
          <div class="ska-stat-card__icon"><i class="fa-solid fa-bed"></i></div>
        </div>
        <div class="ska-stat-card__value" id="statRooms">—</div>
        <div class="ska-stat-card__sub">In Supabase</div>
      </div>
      <div class="ska-stat-card ska-stat-card--navy">
        <div class="ska-stat-card__header">
          <div class="ska-stat-card__label">Bookings</div>
          <div class="ska-stat-card__icon"><i class="fa-solid fa-calendar-check"></i></div>
        </div>
        <div class="ska-stat-card__value" id="statBookings">—</div>
        <div class="ska-stat-card__sub">All reservations</div>
      </div>
      <div class="ska-stat-card ska-stat-card--warning">
        <div class="ska-stat-card__header">
          <div class="ska-stat-card__label">Pending</div>
          <div class="ska-stat-card__icon"><i class="fa-solid fa-clock"></i></div>
        </div>
        <div class="ska-stat-card__value" id="statPending">—</div>
        <div class="ska-stat-card__sub">Awaiting review</div>
      </div>
      <div class="ska-stat-card ska-stat-card--success">
        <div class="ska-stat-card__header">
          <div class="ska-stat-card__label">Inquiries</div>
          <div class="ska-stat-card__icon"><i class="fa-solid fa-envelope"></i></div>
        </div>
        <div class="ska-stat-card__value" id="statInquiries">—</div>
        <div class="ska-stat-card__sub">Contact messages</div>
      </div>
    </div>

    <div class="ska-card" style="margin-bottom:24px;">
      <div class="ska-card__header">
        <h2 class="ska-card__title">Recent <span>Bookings</span></h2>
        <a href="bookings.html" class="ska-btn ska-btn--ghost ska-btn--sm">View all</a>
      </div>
      <div class="ska-card__body">
        <table class="ska-table">
          <thead>
            <tr>
              <th>Guest</th>
              <th>Property</th>
              <th>Room</th>
              <th>Dates</th>
              <th>Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="bookingsBody">
            <tr><td colspan="6" class="ska-table-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="ska-card">
      <div class="ska-card__header">
        <h2 class="ska-card__title">Recent <span>Inquiries</span></h2>
        <a href="inquiries.html" class="ska-btn ska-btn--ghost ska-btn--sm">View all</a>
      </div>
      <div class="ska-card__body">
        <table class="ska-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Subject</th>
              <th>Message</th>
              <th>Read</th>
            </tr>
          </thead>
          <tbody id="inquiriesBody">
            <tr><td colspan="5" class="ska-table-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
