<!DOCTYPE html>
<html lang="en" data-ska-static="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Sign In | SKA The Boutique</title>
  <link rel="icon" href="../assets/images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/login.css">
</head>
<body class="ska-login">

<div class="ska-login-wrap">
  <div class="login-card">

    <div class="logo">
      <img src="../assets/images/ska_logo1.png" alt="SKA The Boutique" width="120">
      <h4>SKA <span>Admin Portal</span></h4>
      <p class="logo-sub">Property management &amp; reservations</p>
    </div>

    <div id="loginError" class="error" style="display:none" role="alert">
      <i class="fa-solid fa-circle-xmark"></i>
      <span id="loginErrorText"></span>
    </div>

    <form id="adminLoginForm" class="ska-login-form" autocomplete="on">
      <div class="mb-3">
        <label class="form-label-ska" for="adminEmail">Email</label>
        <div class="input-icon-wrap">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="adminEmail" class="form-control" placeholder="admin@skaboutiquebnb.com" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label-ska" for="adminPass">Password</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="adminPass" class="form-control" placeholder="Enter your password" required>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-login">
        <span>Sign In</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="login-footer">
      <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Back to website</a>
      <span class="login-footer__dot"></span>
      <span>Supabase Auth</span>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/ska-config.js"></script>
<script src="../assets/js/ska-api.js"></script>
<script>
document.getElementById('togglePw')?.addEventListener('click', function () {
  var input = document.getElementById('adminPass');
  var icon = this.querySelector('i');
  var show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  icon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
});

document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var errEl = document.getElementById('loginError');
  var errTxt = document.getElementById('loginErrorText');
  errEl.style.display = 'none';
  try {
    await SkaApi.adminSignIn(adminEmail.value, adminPass.value);
    location.href = 'dashboard.html';
  } catch (ex) {
    errTxt.textContent = ex.message || 'Sign in failed';
    errEl.style.display = 'flex';
  }
});

SkaApi.adminSession().then(function (s) {
  if (s) location.href = 'dashboard.html';
});
</script>
</body>
</html>
