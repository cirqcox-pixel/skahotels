<!DOCTYPE html>
<html lang="en" data-ska-static="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Sign In | SKA The Boutique</title>
  <link rel="icon" href="../assets/images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/login.css">
</head>
<body class="ska-login">

<div class="ska-login-wrap">
  <div class="login-card">

    <div class="logo">
      <img src="../assets/images/ska_logo1.png" alt="SKA The Boutique" width="120">
      <h4>SKA <span>Admin Portal</span></h4>
      <p class="logo-sub">Property management &amp; reservations</p>
    </div>

    <div id="loginError" class="error" style="display:none" role="alert">
      <i class="fa-solid fa-circle-xmark"></i>
      <span id="loginErrorText"></span>
    </div>
    <div id="loginNotice" class="error" style="display:none;background:#fff8e1;border-color:#ffe082;color:#7d5c00;" role="status">
      <i class="fa-solid fa-circle-info"></i>
      <span id="loginNoticeText"></span>
    </div>

    <form id="adminSetPasswordForm" class="ska-login-form" autocomplete="on" style="display:none">
      <p class="logo-sub" style="margin-bottom:16px">Choose a password for your admin account.</p>
      <div class="mb-3">
        <label class="form-label-ska" for="adminNewPass">New password</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="adminNewPass" class="form-control" placeholder="At least 8 characters" required minlength="8">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label-ska" for="adminNewPass2">Confirm password</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="adminNewPass2" class="form-control" placeholder="Repeat password" required minlength="8">
        </div>
      </div>
      <button type="submit" class="btn btn-login">
        <span>Save password &amp; continue</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <form id="adminLoginForm" class="ska-login-form" autocomplete="on">
      <div class="mb-3">
        <label class="form-label-ska" for="adminEmail">Email</label>
        <div class="input-icon-wrap">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="adminEmail" class="form-control" placeholder="admin@skahotels.com" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label-ska" for="adminPass">Password</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="adminPass" class="form-control" placeholder="Enter your password" required>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-login">
        <span>Sign In</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="login-footer">
      <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Back to website</a>
      <span class="login-footer__dot"></span>
      <span>Supabase Auth</span>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/ska-config.js?v=20260920h"></script>
<script src="../assets/js/ska-notify.js?v=20260920h"></script>
<script src="../assets/js/ska-api.js?v=20260920h"></script>
<script>
document.getElementById('togglePw')?.addEventListener('click', function () {
  var input = document.getElementById('adminPass');
  var icon = this.querySelector('i');
  var show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  icon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
});

function showErr(msg) {
  var errEl = document.getElementById('loginError');
  var errTxt = document.getElementById('loginErrorText');
  errTxt.textContent = msg;
  errEl.style.display = 'flex';
}

function wantsSetPassword() {
  var q = new URLSearchParams(location.search);
  var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  return q.get('set_password') === '1' ||
    h.get('type') === 'invite' ||
    h.get('type') === 'recovery' ||
    h.get('type') === 'magiclink';
}

function showSetPassword() {
  document.getElementById('adminLoginForm').style.display = 'none';
  document.getElementById('adminSetPasswordForm').style.display = '';
  var notice = document.getElementById('loginNotice');
  var noticeTxt = document.getElementById('loginNoticeText');
  noticeTxt.textContent = 'Invite received. Set a password to finish signing in.';
  notice.style.display = 'flex';
}

document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  document.getElementById('loginError').style.display = 'none';
  try {
    await SkaApi.adminSignIn(adminEmail.value.trim(), adminPass.value);
    location.href = 'dashboard.html';
  } catch (ex) {
    showErr(ex.message || 'Sign in failed');
  }
});

document.getElementById('adminSetPasswordForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  document.getElementById('loginError').style.display = 'none';
  var a = document.getElementById('adminNewPass').value;
  var b = document.getElementById('adminNewPass2').value;
  if (a !== b) {
    showErr('Passwords do not match.');
    return;
  }
  try {
    var sb = SkaApi.client();
    var res = await sb.auth.updateUser({ password: a });
    if (res.error) throw res.error;
    location.href = 'dashboard.html';
  } catch (ex) {
    showErr(ex.message || 'Could not save password');
  }
});

(function () {
  var needPw = wantsSetPassword();
  SkaApi.client().auth.onAuthStateChange(function (event, session) {
    if (!session) return;
    if (needPw || event === 'PASSWORD_RECOVERY') {
      showSetPassword();
      return;
    }
    if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
      location.href = 'dashboard.html';
    }
  });
  SkaApi.adminSession().then(function (s) {
    if (!s) return;
    if (needPw) showSetPassword();
    else location.href = 'dashboard.html';
  });
})();

(function () {
  var p = new URLSearchParams(location.search);
  if (p.get('reason') === 'session' || p.get('reason') === 'auth') {
    var notice = document.getElementById('loginNotice');
    var noticeTxt = document.getElementById('loginNoticeText');
    noticeTxt.textContent = 'Your session expired. Please sign in again.';
    notice.style.display = 'flex';
  }
  if (p.get('reason') === 'forbidden') {
    var notice2 = document.getElementById('loginNotice');
    var noticeTxt2 = document.getElementById('loginNoticeText');
    noticeTxt2.textContent = 'This account is not on the admin list. Ask a Super Admin to add you under Users & Roles.';
    notice2.style.display = 'flex';
  }
})();
</script>
</body>
</html>
