<!DOCTYPE html>
<html lang="en" data-ska-static="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Property settings | SKA Admin</title>
  <link rel="icon" href="../assets/images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body data-admin-page="settings">

  <div class="ska-sidebar__brand">
    <div class="ska-sidebar__brand-name">SKA <span>Admin</span></div>
    <div class="ska-sidebar__brand-sub">GitHub Pages CMS</div>
  </div>
  <nav class="ska-sidebar__nav">
    <div class="ska-nav-label">Main</div>
    <a href="dashboard.html" class="ska-nav-link" data-nav-page="dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a href="../index.html" class="ska-nav-link" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> View Website</a>

    <div class="ska-nav-label">Property</div>
    <a href="rooms.html" class="ska-nav-link" data-nav-page="rooms"><i class="fa-solid fa-bed"></i> Rooms</a>
    <a href="promotions.html" class="ska-nav-link" data-nav-page="promotions"><i class="fa-solid fa-tag"></i> Promotions</a>
    <a href="packages.html" class="ska-nav-link" data-nav-page="packages"><i class="fa-solid fa-gift"></i> Packages</a>
    <a href="bookings.html" class="ska-nav-link" data-nav-page="bookings"><i class="fa-solid fa-calendar-days"></i> Bookings</a>
    <a href="settings.html" class="ska-nav-link active" data-nav-page="settings"><i class="fa-solid fa-gear"></i> Property settings</a>

    <div class="ska-nav-label">Content</div>
    <a href="inquiries.html" class="ska-nav-link" data-nav-page="inquiries"><i class="fa-solid fa-envelope"></i> Inquiries</a>
    <a href="users.html" class="ska-nav-link" data-nav-page="users"><i class="fa-solid fa-users"></i> Users &amp; Roles</a>
  </nav>
  <div class="ska-sidebar__footer">
    <div class="ska-sidebar__avatar"><i class="fa-solid fa-user"></i></div>
    <div>
      <div class="ska-sidebar__user-name" id="adminUserEmail">Admin</div>
      <div class="ska-sidebar__user-role" id="adminUserRole">Staff</div>
    </div>
    <button type="button" class="ska-sidebar__logout" id="adminLogout" title="Sign out">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
    </button>
  </div>
</aside>

<div class="ska-main">
  <header class="ska-topbar">
    <div class="ska-topbar__left">
      <div class="ska-topbar__title">Property settings</div>
      <div class="ska-topbar__breadcrumb">Contacts, notification inboxes, maps, and social links</div>
    </div>
  </header>

  <main class="ska-content">
    <div id="adminError" class="ska-alert ska-alert--danger" style="display:none;margin-bottom:20px;" role="alert"></div>
    <div id="adminToast" class="ska-alert ska-alert--success" style="display:none;margin-bottom:20px;" role="status"></div>

    <form id="settingsForm">
      <div class="ska-card" style="margin-bottom:20px">
        <div class="ska-card__header"><h2 class="ska-card__title">Brand &amp; <span>footer</span></h2></div>
        <div class="ska-card__body">
          <div class="ska-form-grid">
            <div class="ska-form-field"><label>Site email</label><input class="ska-input" name="site_email" data-group="contact"></div>
            <div class="ska-form-field"><label>Main phone</label><input class="ska-input" name="site_phone_main" data-group="contact"></div>
            <div class="ska-form-field"><label>Footer address</label><input class="ska-input" name="site_address" data-group="contact"></div>
            <div class="ska-form-field"><label>Footer tagline</label><input class="ska-input" name="footer_tagline" data-group="contact"></div>
            <div class="ska-form-field ska-form-field--full"><label>Footer description</label><textarea class="ska-input" name="footer_blurb" data-group="contact" rows="3"></textarea></div>
          </div>
        </div>
      </div>

      <div class="ska-card" style="margin-bottom:20px">
        <div class="ska-card__header"><h2 class="ska-card__title">Follow <span>us</span></h2></div>
        <div class="ska-card__body">
          <div class="ska-form-grid">
            <div class="ska-form-field"><label>Instagram URL</label><input class="ska-input" name="instagram_url" data-group="social"></div>
            <div class="ska-form-field"><label>Facebook URL</label><input class="ska-input" name="facebook_url" data-group="social"></div>
            <div class="ska-form-field ska-form-field--full"><label>WhatsApp URL</label><input class="ska-input" name="whatsapp_url" data-group="social" placeholder="https://wa.me/256741186891"></div>
          </div>
        </div>
      </div>

      <div class="ska-card" style="margin-bottom:20px">
        <div class="ska-card__header"><h2 class="ska-card__title">Naguru <span>property</span></h2></div>
        <div class="ska-card__body">
          <div class="ska-form-grid">
            <div class="ska-form-field"><label>Display name</label><input class="ska-input" name="naguru_name" data-group="contact"></div>
            <div class="ska-form-field"><label>Phone</label><input class="ska-input" name="naguru_phone" data-group="contact"></div>
            <div class="ska-form-field"><label>Booking / notify email</label><input class="ska-input" name="naguru_notify_email" data-group="contact"></div>
            <div class="ska-form-field"><label>Public email</label><input class="ska-input" name="naguru_email" data-group="contact"></div>
            <div class="ska-form-field"><label>Alt email</label><input class="ska-input" name="naguru_email_alt" data-group="contact"></div>
            <div class="ska-form-field"><label>WhatsApp URL</label><input class="ska-input" name="naguru_whatsapp" data-group="contact"></div>
            <div class="ska-form-field ska-form-field--full"><label>Address</label><textarea class="ska-input" name="naguru_address" data-group="contact" rows="2"></textarea></div>
            <div class="ska-form-field ska-form-field--full"><label>Google Maps embed URL</label><textarea class="ska-input" name="naguru_map_embed" data-group="contact" rows="3"></textarea></div>
          </div>
        </div>
      </div>

      <div class="ska-card" style="margin-bottom:20px">
        <div class="ska-card__header"><h2 class="ska-card__title">Munyonyo <span>property</span></h2></div>
        <div class="ska-card__body">
          <div class="ska-form-grid">
            <div class="ska-form-field"><label>Display name</label><input class="ska-input" name="munyonyo_name" data-group="contact"></div>
            <div class="ska-form-field"><label>Phone</label><input class="ska-input" name="munyonyo_phone" data-group="contact"></div>
            <div class="ska-form-field"><label>Booking / notify email</label><input class="ska-input" name="munyonyo_notify_email" data-group="contact"></div>
            <div class="ska-form-field"><label>Public email</label><input class="ska-input" name="munyonyo_email" data-group="contact"></div>
            <div class="ska-form-field"><label>Alt email</label><input class="ska-input" name="munyonyo_email_alt" data-group="contact"></div>
            <div class="ska-form-field"><label>WhatsApp URL</label><input class="ska-input" name="munyonyo_whatsapp" data-group="contact"></div>
            <div class="ska-form-field ska-form-field--full"><label>Address</label><textarea class="ska-input" name="munyonyo_address" data-group="contact" rows="2"></textarea></div>
            <div class="ska-form-field ska-form-field--full"><label>Google Maps embed URL</label><textarea class="ska-input" name="munyonyo_map_embed" data-group="contact" rows="3"></textarea></div>
          </div>
        </div>
      </div>

      <button type="submit" class="ska-btn ska-btn--primary"><i class="fa-solid fa-floppy-disk"></i> Save settings</button>
    </form>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/ska-config.js?v=20260920k"></script>
<script src="../assets/js/ska-notify.js?v=20260920k"></script>
<script src="../assets/js/ska-api.js?v=20260920k"></script>
<script src="../assets/js/ska-admin.js?v=20260920k"></script>
</body>
</html>
