<div class="ska-main"><header class="ska-topbar"><div class="ska-topbar__left"><div class="ska-topbar__title">Jobs</div><div class="ska-topbar__breadcrumb">Create, publish, and unpublish vacancies</div></div></header><main class="ska-content"><div id="adminError" class="ska-alert ska-alert--danger" style="display:none;margin-bottom:20px"></div><div id="adminToast" class="ska-alert ska-alert--success" style="display:none;margin-bottom:20px"></div><div class="ska-card" style="margin-bottom:20px"><div class="ska-card__header"><h2 class="ska-card__title">Post a <span>job</span></h2></div><div class="ska-card__body ska-card__body--padded"><form id="jobForm"><input type="hidden" name="id"><div class="ska-form-grid"><div class="ska-form-field"><label>Job title</label><input class="ska-input" name="title" required></div><div class="ska-form-field"><label>Location</label><input class="ska-input" name="tag" value="Kampala, Uganda"></div><div class="ska-form-field ska-form-field--full"><label>Job description</label><textarea class="ska-input" name="body" rows="6" required></textarea></div><div class="ska-form-field"><label>Status</label><select class="ska-input" name="active"><option value="true">Published</option><option value="false">Draft / Unpublished</option></select></div><div class="ska-form-field"><label>Display order</label><input class="ska-input" name="sort_order" type="number" value="10"></div></div><button class="ska-btn ska-btn--primary" type="submit">Save job</button></form></div></div><div class="ska-card"><div class="ska-card__header"><h2 class="ska-card__title">Posted <span>jobs</span></h2></div><div class="ska-card__body"><table class="ska-table"><thead><tr><th>Job</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead><tbody id="jobsTableBody"><tr><td colspan="4" class="ska-table-empty">Loading…</td></tr></tbody></table></div></div></main></div>
